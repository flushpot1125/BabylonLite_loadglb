services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - type: bind
        source: ./
        target: /app
      - type: volume
        target: /app/node_modules
     # - .:/app
     # - /app/node_modules
    #command: sh -c "npm install && npm run dev -- --host"

    command: sh -c "npm run dev -- --host"